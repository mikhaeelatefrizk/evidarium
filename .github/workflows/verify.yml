name: Verify research workspace
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install base Python requirements
        run: python -m pip install -r companion/requirements.txt rispy==0.9.0 bibtexparser==1.4.3
      - name: Install the local server's JavaScript dependencies
        run: npm install --prefix .ci-deps --ignore-scripts saxes@6.0.0 jstat@1.9.6 unpdf@1.8.1
      - name: Prepare local dependency layout and worker path
        shell: python
        run: |
          import os, shutil, sys
          from pathlib import Path
          for name in ['saxes', 'xmlchars', 'jstat', 'unpdf']:
              shutil.copytree(Path('.ci-deps/node_modules')/name,Path('node_modules')/name)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('EVIDARIUM_TEST_PYTHON='+sys.executable+'\n')
      - name: Python validation
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Independent bibliography readers
        run: python scripts/verify-bibliography.py
      - name: Required SQLite runtime capability
        run: node scripts/check-runtime.mjs
      - name: HTTP, storage, approval and real worker tests
        run: node --test tests/workspace.test.mjs tests/research.test.mjs tests/runtime.test.mjs tests/worker.test.mjs tests/live-check.test.mjs tests/web-science.test.mjs tests/web-tasks.test.mjs tests/web-pdf.test.mjs tests/writing.test.mjs
      - name: Check launcher syntax on Unix
        if: runner.os != 'Windows'
        run: bash -n start.sh
      - name: Check launcher syntax on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'start-windows.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
      - name: Install frontend build dependencies
        run: |
          npm install -g pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Build actual local UI
        run: pnpm build:local
      - name: Test the real installer and HTTP application
        run: python scripts/verify-install.py
  scientific-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
      - name: Install actual scientific engines
        run: |
          python -m pip install -r companion/requirements.txt -r companion/engines/asreview.txt -r companion/engines/indra.txt
          Rscript -e 'install.packages(c("metafor", "jsonlite"), repos="https://cloud.r-project.org")'
          npm install --prefix .ci-deps --ignore-scripts saxes@6.0.0 jstat@1.9.6 unpdf@1.8.1
      - name: Configure test worker
        shell: python
        run: |
          import os, shutil, sys
          from pathlib import Path
          for name in ['saxes', 'xmlchars', 'jstat', 'unpdf']:
              shutil.copytree(Path('.ci-deps/node_modules')/name,Path('node_modules')/name)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('EVIDARIUM_TEST_PYTHON='+sys.executable+'\n')
      - name: Real approved scientific workflows
        run: node --test tests/integration/engines.test.mjs
      - name: Independent website numerical reference
        run: python scripts/verify-web-science.py --output /tmp/web-science-reference.json
      - name: Build isolated Python image
        run: docker build -f companion/docker/Dockerfile -t evidarium-analysis:0.1.0 companion/docker
      - name: Real Docker execution and boundary checks
        run: python tests/integration/verify-docker.py
